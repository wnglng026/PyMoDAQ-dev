name: i18n audit

on:
  pull_request:
    paths:
      - ".github/workflows/i18n-audit.yml"
      - "packages/pymodaq_utils/**"
      - "packages/pymodaq_gui/**"
      - "packages/pymodaq/**"
      - "tools/i18n/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Chinese translation audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/pymodaq_utils/pyproject.toml

      - name: Install i18n extraction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6
          python -m pip install -e packages/pymodaq_utils

      - name: Audit pymodaq translations
        run: python tools/i18n/i18n_audit.py --package pymodaq --fail-under 95 --min-entries pymodaq=450

      - name: Audit pymodaq_gui translations
        run: python tools/i18n/i18n_audit.py --package pymodaq_gui --fail-under 95 --min-entries pymodaq_gui=400
